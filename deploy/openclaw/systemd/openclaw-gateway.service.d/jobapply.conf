# Drop-in for the gateway service that `openclaw onboard --install-daemon` creates.
# Install to ~/.config/systemd/user/openclaw-gateway.service.d/jobapply.conf (check the unit name with
# `systemctl --user list-units 'openclaw*'`), then `systemctl --user daemon-reload`.
[Unit]
Wants=xvfb.service
After=xvfb.service

[Service]
Environment=DISPLAY=:99
Environment=JOBAPPLY_HOME=%h/jobapply-home
Environment=JOBAPPLY_SECRETS=%h/.config/jobapply
Environment=DISABLE_AUTOUPDATER=1
# `jobs` first, then Claude Code and OpenClaw (claw's own npm prefix); node itself is in /usr/bin.
Environment=PATH=/opt/jobapply/.venv/bin:%h/.local/bin:%h/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
UMask=0077
